name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - run: npm run build
      - name: Prepare site
        run: |
          mkdir -p site
          cp dist/syndicate-ledger.html site/index.html
          cp dist/syndicate-ledger.html site/syndicate-ledger.html
      # v1 (the pre-Svelte game) stays playable at /v1/, built from its exact commit.
      - uses: actions/checkout@v4
        with:
          ref: 7c7e0e0aadb24fe06ece3cd86459af6cdb0e6056
          path: v1src
      - name: Build v1
        working-directory: v1src
        run: |
          npm ci
          npm run build
      - name: Add v1 to the site
        run: |
          mkdir -p site/v1
          cp v1src/dist/syndicate-ledger.html site/v1/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
